services:
  db:
    image: postgres:15-alpine
    container_name: userservice-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: userservice
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d userservice" ]
      interval: 5s
      timeout: 5s
      retries: 5
